{{- $summary := .Get "summary" -}}
{{- $open := .Get "open" -}}
{{- $card := .Get "card" -}}
<details id="{{ $summary | anchorize }}"{{ if eq $open "true" }} open{{ end }}{{ if eq $card "true" }} class="faq-card"{{ end }}>
<summary>{{ $summary | markdownify }}</summary>
{{- if eq $card "true" }}<div class="faq-body">{{ end -}}
{{ .Inner | markdownify }}
{{- if eq $card "true" }}</div>{{ end -}}
</details>
