[build-system]
# setuptools >= 77 is required for PEP 639 (SPDX `license` + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reqmd-io"
# Versioned independently of the reqmd binaries: bump it only for a new
# feature or an exchange-format change, not for every reqmd release.
# Released by pushing a `py-v<version>` tag (see .github/workflows/publish-python.yml).
version = "0.2.0"
description = "Build reqmd-import/v1 exchange bundles from Python — write importers for DOORS, codeBeamer, ReqIF, CSV, or any API without hand-writing reqmd Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["reqmd", "requirements", "traceability", "reqif", "doors", "codebeamer", "alm", "import", "markdown"]
authors = [{ name = "Daniel Vollrath", email = "info@reqmd.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://reqmd.dev"
Repository = "https://github.com/dVoo/reqmd"
Issues = "https://github.com/dVoo/reqmd/issues"
Documentation = "https://reqmd.dev/import/"

[tool.setuptools]
packages = ["reqmd_io"]
