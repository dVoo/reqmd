version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - modernize
    - copyloopvar
    - intrange
    - gocritic
    - revive
    - gocognit
    - unconvert
    - unparam
    - nakedret
    - errorlint
    - nilerr
    - wrapcheck
    - gosec
    - misspell
    - whitespace
    - nolintlint
    - gocheckcompilerdirectives
    - bodyclose
    - noctx
    - contextcheck
    - exhaustive

  settings:
    gocognit:
      min-complexity: 20
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    presets: [comments, common-false-positives, std-error-handling]
    rules:
      - path: _test\.go
        linters: [wrapcheck, gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dVoo/reqmd
