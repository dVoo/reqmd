$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "reqmd-test-specs"
title: "reqmd Test Specifications"
type: object
required:
  - verify
  - test-type
properties:
  verify:
    type: string
    enum: [Test, Review, Inspection, Analysis, Demonstration]
    description: "Verification method. Test = automated; Review/Inspection/Analysis/Demonstration = manual methods. Each measure traces to the requirement(s) it verifies."
  test-type:
    type: string
    enum: [unit, integration, end-to-end, build]
    description: "Test classification for verify: Test measures. Ignored for other methods."
additionalProperties: false

x-reqmd:
  level: test-specs
  document-id: tests
  upstream:
    level: software-requirements
    sources:
      - ../03-software/
  mandatory-disposition: true
  id-prefix: TST-
