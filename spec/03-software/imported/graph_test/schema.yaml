-$id: https://reqmd.xyz/schemas/imported-v1.json
+$id: https://reqmd.xyz/schemas/imported-v1.json
 $schema: https://json-schema.org/draft/2020-12/schema
 additionalProperties: false
 description: |
     Standard schema for machine-generated requirements produced by reqmd-import.
     Generated items are first-class coverage providers (status defaults to
     'approved') and carry provenance metadata via x-reqmd.imported and
     x-reqmd.source-* attributes that the extractor writes into every
     emitted requirement.
 
     Built-in attributes (status, trace, disposition, disposition-reason,
     version, requires-trace-from) are injected automatically by reqmd and
     must not be redefined in this schema.
 properties:
     x-reqmd.heuristic-trace:
         description: |
             Requirement IDs inferred from bare occurrences in the source code
             (e.g. "See REQ-AUTH-001 for details") when reqmd-import runs with
             --heuristic-traces. Rendered as a SEPARATE attribute from `trace:`
             so the developer-asserted trace list stays clean and trustworthy.
             The graph checker treats heuristic traces as untrusted; only
             explicit `trace:` entries satisfy requires-trace-from coverage.
         items:
             type: string
         type: array
     x-reqmd.imported:
         description: True if this requirement was machine-generated by reqmd-import.
         type: boolean
     x-reqmd.source-commit:
         description: Git commit SHA when the symbol was last extracted (optional).
         type: string
     x-reqmd.source-file:
         description: Absolute path to the source file the symbol was extracted from.
         type: string
     x-reqmd.source-line:
         description: Line number in the source file where the symbol is defined.
         type: integer
     x-reqmd.symbol-kind:
         description: The kind of source-code symbol (function, method, type, const, var).
         type: string
 title: Auto-imported requirements (reqmd-import)
 type: object
