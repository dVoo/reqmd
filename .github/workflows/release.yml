# Build and publish cross-platform binaries when a tag (v*) is pushed.
#
# Produces `reqmd` and `reqmd-import` for:
#   - linux/amd64
#   - windows/amd64
#   - darwin/arm64    (macOS Apple Silicon)
#
# reqmd is built as a pure-Go binary (CGO_ENABLED=0) WITHOUT the `ladybug`
# build tag. This keeps the release binaries self-contained: no native
# liblbug shared library to ship, no OpenSSL runtime dep, no rpath fixups.
# The cost is that `reqmd export graph` is a stub in release builds — it
# prints an error pointing users to rebuild from source with
# `-tags ladybug` (which requires liblbug; see go-ladybug's docs). The
# ladybug-enabled code path (internal/exporter/graph.go) is still compiled
# and tested via `go vet -tags ladybug`/source builds; it is just not
# included in the pre-built release artifacts.
#
# reqmd-import uses cgo (github.com/smacker/go-tree-sitter) and therefore
# builds natively on each runner with the host C toolchain. No native
# runtime libraries are needed — tree-sitter's C parsers are statically
# linked into the binary.
#
# Artifacts (6 raw binaries + one SHA256SUMS.txt) are attached to a GitHub
# Release tied to the pushed tag via softprops/action-gh-release.
#
# Trigger: any tag matching v* (e.g. v0.1.0). Also runnable manually via
# workflow_dispatch for re-runs against an existing tag.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the pushed tag in push mode; required for manual runs)'
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: darwin
            goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch, check out the requested tag explicitly.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Determine version string
        id: ver
        run: |
          # For tag pushes, GITHUB_REF_NAME is the tag (e.g. v0.1.0).
          # For workflow_dispatch, prefer the inputs.tag value.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            v="${{ github.event.inputs.tag }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version: $v"

      - name: Build reqmd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Pure Go: no cgo, no ladybug tag. The resulting binary has no
          # native runtime dependencies (no liblbug, no libssl). The
          # `export graph` subcommand is a stub in this build.
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="reqmd-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o "$out" ./cmd/reqmd
          echo "Built $(ls -la "$out")"

      - name: Build reqmd-import
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # tree-sitter needs cgo; the host C toolchain on each runner is enough.
          # The C parser sources are statically linked — no runtime libs needed.
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="reqmd-import-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o "$out" ./reqmd-import/cmd/reqmd-import
          echo "Built $(ls -la "$out")"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          # Pin the path to the exact built binary names (with -<os>-<arch>
          # suffix) so the upload does NOT pick up the reqmd-import/ source
          # directory in the workspace root, which would otherwise be
          # uploaded as an artifact and break the sha256sum step.
          path: |
            reqmd-${{ matrix.goos }}-${{ matrix.goarch }}*
            reqmd-import-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          # Checksum only regular files (skip any stray directories) matching
          # the reqmd-* / reqmd-import-* binary naming convention.
          find . -maxdepth 1 -type f \( -name 'reqmd-*' -o -name 'reqmd-import-*' \) \
            -exec sha256sum {} + | sed 's|  \./|  |' | tee SHA256SUMS.txt
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # For workflow_dispatch without a tag input, fall back to the
          # pushed tag (github.ref). action-gh-release uses this tag name.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/reqmd-*
            dist/reqmd-import-*
            dist/SHA256SUMS.txt