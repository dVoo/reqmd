# Build and publish cross-platform binaries when a tag (v*) is pushed.
#
# Produces `reqmd` and `reqmd-import` for:
#   - linux/amd64
#   - windows/amd64
#   - darwin/arm64    (macOS Apple Silicon)
#
# reqmd is built with the `ladybug` build tag (enables `reqmd export graph`),
# which pulls in github.com/LadybugDB/go-ladybug. That binding uses cgo and
# links against a native liblbug shared library shipped per OS/arch by the
# LadybugDB/ladybug GitHub releases. Each matrix job therefore runs on a
# native runner for its target OS and downloads the matching lbug library
# before building. reqmd-import uses cgo via github.com/smacker/go-tree-sitter
# but does NOT need the lbug library, so it builds on the same runner with
# just the host C toolchain.
#
# Artifacts (8 raw binaries + one SHA256SUMS.txt) are attached to a GitHub
# Release tied to the pushed tag via softprops/action-gh-release.
#
# Trigger: any tag matching v* (e.g. v0.1.0). Also runnable manually via
# workflow_dispatch for re-runs against an existing tag.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the pushed tag in push mode; required for manual runs)'
        required: false

permissions:
  contents: write

# Native liblbug version to link against. Bump explicitly when upgrading
# go-ladybug in go.mod or when LadybugDB/ladybug ships a new ABI. The Go
# binding (go-ladybug) and the native library (liblbug) have independent
# release streams; this pin keeps the native lib version reproducible
# across tag builds instead of floating with /releases/latest.
env:
  LADYBUG_VERSION: v0.19.0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            asset: liblbug-linux-x86_64.tar.gz
            asset_ext: tar.gz
            lib_dir: lib/dynamic/linux-amd64
            apt_deps: libssl-dev
          - goos: windows
            goarch: amd64
            runner: windows-latest
            asset: liblbug-windows-x86_64.zip
            asset_ext: zip
            lib_dir: lib/dynamic/windows
          - goos: darwin
            goarch: arm64
            runner: macos-14
            asset: liblbug-osx-universal.tar.gz
            asset_ext: tar.gz
            lib_dir: lib/dynamic/darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch, check out the requested tag explicitly.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install native build deps
        if: matrix.apt_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_deps }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Restore lbug library cache
        id: lbug-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ matrix.lib_dir }}
          key: lbug-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.LADYBUG_VERSION }}

      - name: Download and extract lbug library
        if: steps.lbug-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/LadybugDB/ladybug/releases/download/${LADYBUG_VERSION}/${{ matrix.asset }}"
          echo "Downloading $url"
          if [ "${{ matrix.asset_ext }}" = "zip" ]; then
            curl -L -o lbug.zip "$url"
            mkdir -p ${{ matrix.lib_dir }}
            unzip -o lbug.zip -d extracted
            # Windows archive ships lbug_shared.dll and lbug_shared.lib.
            find extracted -name 'lbug_shared.dll' -exec cp {} ${{ matrix.lib_dir }}/ \;
            find extracted -name 'lbug_shared.lib' -exec cp {} ${{ matrix.lib_dir }}/ \;
            find extracted -name 'lbug.h' -exec cp {} ${{ matrix.lib_dir }}/ \;
            find extracted -name 'lbug.h' -exec cp {} . \;
          else
            curl -L -o lbug.tar.gz "$url"
            mkdir -p ${{ matrix.lib_dir }}
            tar -xzf lbug.tar.gz
            # Linux/macOS archives ship a liblbug.so symlink + versioned
            # libs (liblbug.so.0, liblbug.so.0.19.0) + lbug.h header.
            # Copy the whole family preserving symlinks so rpath lookup works.
            cp -P liblbug.so* ${{ matrix.lib_dir }}/ 2>/dev/null || true
            find . -maxdepth 1 -name 'liblbug.dylib*' -exec cp -P {} ${{ matrix.lib_dir }}/ \; 2>/dev/null || true
            cp lbug.h . 2>/dev/null || true
            cp lbug.h ${{ matrix.lib_dir }}/ 2>/dev/null || true
          fi
          echo "Library directory contents:"
          ls -la ${{ matrix.lib_dir }}

      - name: Set library search paths (Unix)
        if: matrix.goos != 'windows'
        run: |
          echo "LIBRARY_PATH=${{ github.workspace }}/${{ matrix.lib_dir }}:$LIBRARY_PATH" >> "$GITHUB_ENV"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            echo "LD_LIBRARY_PATH=${{ github.workspace }}/${{ matrix.lib_dir }}:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/${{ matrix.lib_dir }}:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Set library search paths (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          # go-ladybug cgo LDFLAGS point at ${SRCDIR}/lib/dynamic/windows via
          # rpath-relative lookup; put the DLL directory on PATH so the
          # linker finds lbug_shared.lib at build time and the binary finds
          # lbug_shared.dll at runtime.
          $libPath = "${{ github.workspace }}\${{ matrix.lib_dir }}"
          echo "LIBRARY_PATH=$libPath;$env:LIBRARY_PATH" >> $env:GITHUB_ENV
          echo "$libPath" >> $env:GITHUB_PATH

      - name: Determine version string
        id: ver
        run: |
          # For tag pushes, GITHUB_REF_NAME is the tag (e.g. v0.1.0).
          # For workflow_dispatch, prefer the inputs.tag value.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            v="${{ github.event.inputs.tag }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version: $v"

      - name: Build reqmd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="reqmd-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -tags ladybug -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o "$out" ./cmd/reqmd
          echo "Built $(ls -la "$out")"

      - name: Build reqmd-import
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # tree-sitter needs cgo; the host C toolchain on each runner is enough.
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="reqmd-import-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o "$out" ./reqmd-import/cmd/reqmd-import
          echo "Built $(ls -la "$out")"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            reqmd-*
            reqmd-import-*
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum reqmd-* reqmd-import-* | tee SHA256SUMS.txt
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # For workflow_dispatch without a tag input, fall back to the
          # pushed tag (github.ref). action-gh-release uses this tag name.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/reqmd-*
            dist/reqmd-import-*
            dist/SHA256SUMS.txt